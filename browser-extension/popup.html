<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 260px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        background: #050505;
        color: #e5f6ff;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 12px;
        letter-spacing: 0.12em;
        color: #22d3ee;
      }
      p { font-size: 12px; line-height: 1.5; color: #94a3b8; margin: 0 0 8px; }
      code { color: #22d3ee; }
    </style>
  </head>
  <body>
    <h1>ZARA BROWSER BRIDGE</h1>
    <p>
      This extension lets ZARA control tabs — go back, go forward, refresh,
      open and close tabs — and read the current page when asked.
    </p>
    <p>
      It connects to the ZARA desktop app on <code>127.0.0.1:5421</code>.
      Keep the desktop app running.
    </p>
  </body>
</html>
